openapi: 3.0.0
info:
  description: |
    ## Overview 

    This is the API description for Sniffie's Orders API.

  version: 1.0.0
  title: Sniffie Orders API
tags:
  - name: orders
    description: Manage orders of an account
paths:
  /orders:
    post:
      tags:
        - orders
      summary: Creates a new order history item
      description: Inserts a orderHistory row
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OrderInput'
                - $ref: '#/components/schemas/OrderInputList'  
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResult'
        500:
          $ref: '#/components/responses/5XX'
components:
  responses:
    5XX:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
              
    OrderResult:
      type: object
      properties:
        requestId:
          type: string
          description: Api gateway request Id
        data:
          $ref: '#/components/schemas/OrderInput'
    OrderInputList:
      type: array
      items:
        $ref: '#/components/schemas/OrderInput'
      maxItems: 200
    OrderInput:
      type: object
      required:
        - soldFrom
        - orderNumber
        - createdAt
        - taxesIncluded
        - orderItems
      properties:
        soldFrom:
          type: string
          description: Name of the shop, channel, website, POS. Grouping factor for sales analytics
          example: 'www.acme-inc.com'
        orderNumber:
          type: string
          description: Order number of whole order 
          example: 'ORD9876-11'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        taxesIncluded:
          type: boolean
          description: Does the order contain tax information
          example: true
        createdAt:
          type: string
          format: datetime
          description: Datetime of the creation date for the order in UTC
          example: '2021-03-20T09:12:28Z'
        additionalDiscountAppliedToOrder:
          type: number
          format: decimal
          description: Amount of discount applied to the order in addition to line item discounts
          example: '0.00'
        totalDiscount:
          type: number
          format: decimal
          default: '0.00'
          description: Total amount of discount applied to the order (all line item discounts + additionalDiscountAppliedToOrder)
          example: '0.00'
        totalTaxAmount:
          type: number
          format: decimal
          description: Total tax amount of the order
          example: '23.99'
        totalPrice:
          type: number
          format: decimal
          description: Total price of the order (with VAT)
          example: '99.95'
        additionalProperties:
          type: object
          additionalProperties: true
          description: additional properties related to this order

    OrderItem:
      type: object
      required:
        - price
        - currency
        - quantity
        - sku
        - orderLineNumber
      properties:
        orderLineNumber:
          type: string
          description: Order line number of the product line item 
          example: 'ORD9876-11-1'
        price:
          type: number
          format: decimal
          description: Price what the customer paid for the item (all discounts, taxes and other charges included)
          example: '99.95'
        currency:
          type: string
          description: Three letter currency code as defined by ISO-4217
          format: iso-4217
          example: 'EUR'
        quantity:
          type: number
          description: How many items were sold of this particular sku
          example: '1'
        sku:
          type: string
          description: unique identifier for an item. Grouping factor for sales analytics
          example: 'SKU-123456-Y4'
        bundleId:
          type: string
          description: If the item is a part of a bundle, this field is used to group the bundles with matching id
          example: "bundle-1"
        taxAmount:
          type: number
          format: decimal
          description: Amount of tax applied to the line item
          example: '23.99'
        discountAmount:
          type: number
          format: decimal
          description: Amount of discount applied to the line item
          example: '0.00'
        originalPrice: 
          type: number
          format: decimal
          description: Original (RRP) price of the line item, including tax and excluding discount
        
       